<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Pedido</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    

    <header style="padding: 20px; background: rgb(6, 5, 76); color: white;">
        <a href="cardapio.html" style="color: white; text-decoration: none;"><i class="bi bi-arrow-left"></i> Voltar ao cardápio</a>
        <h2 style="margin-top: 10px;">Seu pedido</h2>
    </header>

    <main style="padding: 20px;">
        <ul id="lista-pedidos" style="padding: 0;">
            </ul>

        <div id="acoes-pedido" style="margin-top: 30px; display: none;">
            <button onclick="confirmarPedido()" style="width: 100%; padding: 15px; background: green; color: white; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px;">
                CONFIRMAR PEDIDO
            </button>
            
            <button onclick="esvaziarSacola()" style="width: 100%; padding: 10px; background: transparent; color: #e21b1b; border: 1px solid #e21b1b; border-radius: 8px;">
                Esvaziar sacola
            </button>
        </div>

        <div id="container-historico" style="padding: 20px;"></div>
    </main>

    <div id="tela-status" style="display: none;">
    
    <div class="container_primario">
        <div class="imagem-logo">
            <img src="imagens/logo.png" alt="Imagem do logo">
        </div>
        
        <a href="cardapio.html" style="color: white; text-decoration: none;">
            <i class="bi bi-arrow-left" style="font-size: 2rem; cursor: pointer;"></i>
        </a>
    </div>

    <div style="text-align: center; padding: 20px;">
        <div class="card-status" style="background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px;">
            <i class="bi bi-clock-history" id="icone-status" style="font-size: 3rem; color: #e21b1b;"></i>
            <h2 id="texto-status" style="margin-top: 20px;">Aguardando confirmação...</h2>
            <hr>
            <h3>Resumo do seu pedido:</h3>
            <div id="resumo-itens-status"></div>
        </div>
    </div>
</div>

    <script src="pedidos.js"></script>
</body>
</html>
