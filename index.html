<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>
<body class="container-login">
    <div class="login-principal">
        <div class="img-login">
            <div>
                <img src="imagens/logo.png" alt="">
            </div>
        </div>
        <h2>Faça o seu cadastro</h2>
      <div class="info-login">

    <div>
        <input type="text" id="nome-cadastro" name="nome" placeholder="Nome completo">
    </div>

    <div>
        <input type="email" id="email-cadastro" name="email" placeholder="E-mail">
    </div>

    <div>
        <input type="password" id="senha-cadastro" name="senha" placeholder="Senha">
    </div>

    <div>
        <input type="password" id="confirmar-senha-cadastro" name="confirmarSenha" placeholder="Confirmar senha">
    </div>
    <div class="botao-login">
        <button id="cadastrarLogin">Cadastrar</button>
    </div>
    <div id="mensagem-cadastro"></div>

</div>
        
    </div>

    <script src="cadastro.js"></script>
</body>
</html>
