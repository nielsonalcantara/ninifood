<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>
<body class="container-login">
    <div class="login-principal">
        <div class="img-login">
            <div>
                <img src="imagens/logo.png" alt="">
            </div>
        </div>
        <h2>Login</h2>
        <div class="info-login">
            <div>
                <input type="email" id="email-login" placeholder="Usuário">
            </div>
            <div>
                <input type="password" id="senha-login" placeholder="Senha">
            </div>
        </div>
        <div class="botao-login">
            <button id="entrar-login">Entrar</button>
        </div>
        <div class="cadastro-info">
            <span>Ainda não possui uma conta?</span><a href="index.html">Cadastre-se</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
